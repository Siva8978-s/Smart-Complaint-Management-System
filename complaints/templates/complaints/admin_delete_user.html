{% extends "complaints/base.html" %}

{% block content %}

<div class="container" style="max-width: 600px; margin: 60px auto;">

    <div class="card" style="
        background: white;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        text-align: center;
    ">

        <h2 style="margin-bottom: 15px;">
            Delete User
        </h2>

        <p style="color: #64748b; margin-bottom: 25px;">
            Are you sure you want to delete
            <strong>{{ user_obj.username }}</strong>?
        </p>

        <p style="color: #ef4444; font-size: 14px; margin-bottom: 25px;">
            This action cannot be undone.
        </p>

        <form method="POST">
            {% csrf_token %}

            <button type="submit" style="
                background: #dc2626;
                color: white;
                border: none;
                padding: 11px 20px;
                border-radius: 8px;
                cursor: pointer;
                margin-right: 10px;
            ">
                Yes, Delete
            </button>

            <a href="{% url 'admin_users' %}" style="
                background: #e5e7eb;
                color: #374151;
                text-decoration: none;
                padding: 11px 20px;
                border-radius: 8px;
            ">
                Cancel
            </a>
        </form>

    </div>

</div>

{% endblock %}
